services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: qriously
      POSTGRES_PASSWORD: qriously
      POSTGRES_DB: qriously
    ports:
      - "5432:5432"
    volumes:
      - qriously_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qriously"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qriously_pgdata:
