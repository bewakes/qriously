<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Qriously — What made you Qrious today?</title>
  <meta name="description" content="Ask anything. Qriously turns your curiosity into understanding." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="halftone" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="masthead">
    <a class="brand" href="../index.html" aria-label="Qriously home">
      <span class="brand-mark" aria-hidden="true">?</span>
      <span class="brand-name">Qriously</span>
    </a>
    <span class="issue">A ZINE ABOUT ASKING · No. 01 · 2026</span>
    <nav class="topnav">
      <a class="navbtn" href="#">Subscribe</a>
    </nav>
  </header>

  <main class="stage">
    <p class="eyebrow">[ ASK ANYTHING · LEARN EVERYTHING ]</p>

    <h1 class="hero">
      What made you
      <span class="spark">Qrious</span>
      today?
    </h1>

    <form class="ask" id="askForm" autocomplete="off">
      <span class="ask-icon" aria-hidden="true">?</span>
      <input
        id="askInput"
        name="question"
        type="text"
        placeholder="Type a question, any question…"
        aria-label="What made you Qrious today?"
      />
      <button type="submit" class="ask-btn">Ask it</button>
    </form>

    <p class="hint">Press <kbd>Enter</kbd> · Issue printed fresh daily</p>

    <section class="samples" id="samples" aria-label="Sample questions">
      <p class="samples-label">// PROMPTS YOU CAN STEAL</p>
      <div class="cards">
        <button class="card" data-q="Why is the sky blue?">
          <span class="card-tag">Physics</span>
          <span class="card-text">Why is the sky blue?</span>
        </button>
        <button class="card" data-q="How do black holes bend time?">
          <span class="card-tag">Space</span>
          <span class="card-text">How do black holes bend time?</span>
        </button>
        <button class="card" data-q="What did ancient people dream about?">
          <span class="card-tag">History</span>
          <span class="card-text">What did ancient people dream about?</span>
        </button>
        <button class="card" data-q="Can you learn a language while you sleep?">
          <span class="card-tag">Mind</span>
          <span class="card-text">Can you learn a language while you sleep?</span>
        </button>
      </div>
    </section>

    <section class="response" id="response" hidden aria-live="polite">
      <p class="response-label">YOU ASKED</p>
      <p class="response-q" id="responseQ"></p>
      <p class="response-status" id="responseStatus">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="response-note">Rolling the press…</span>
      </p>
      <button type="button" class="response-reset" id="responseReset">Ask another</button>
    </section>
  </main>

  <footer class="footer">
    <span>© 2026 QRIOUSLY</span>
    <span class="footer-dot">✳</span>
    <span>STAY CURIOUS</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
