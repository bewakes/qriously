<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Qriously — What made you Qrious today?</title>
  <meta name="description" content="Ask anything. Qriously turns your curiosity into understanding." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="fluid" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="orb orb-4"></span>
    <span class="grain"></span>
  </div>

  <header class="topbar">
    <a class="brand" href="../index.html" aria-label="Qriously home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-3.5-3.5" />
        </svg>
      </span>
      <span class="brand-name">Qriously</span>
    </a>
    <nav class="topnav">
      <a class="navlink" href="#">Sign in</a>
      <a class="navbtn" href="#">Get started</a>
    </nav>
  </header>

  <main class="stage">
    <div class="glass console">
      <p class="eyebrow">Ask anything · Learn everything</p>

      <h1 class="hero">
        What made you
        <span class="spark">Qrious</span>
        today?
      </h1>

      <form class="ask" id="askForm" autocomplete="off">
        <span class="ask-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
            <path d="M12 17h.01" />
          </svg>
        </span>
        <input
          id="askInput"
          name="question"
          type="text"
          placeholder="I've always wondered…"
          aria-label="What made you Qrious today?"
        />
        <button type="submit" class="ask-btn">
          <span>Ask</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14" />
            <path d="M13 6l6 6-6 6" />
          </svg>
        </button>
      </form>

      <p class="hint">Press <kbd>Enter</kbd> to ask · No sign-up needed</p>
    </div>

    <section class="samples" id="samples" aria-label="Sample questions">
      <p class="samples-label">Need a spark? Try one</p>
      <div class="cards">
        <button class="card" data-q="Why is the sky blue?">
          <span class="card-tag">Physics</span>
          <span class="card-text">Why is the sky blue?</span>
        </button>
        <button class="card" data-q="How do black holes bend time?">
          <span class="card-tag">Space</span>
          <span class="card-text">How do black holes bend time?</span>
        </button>
        <button class="card" data-q="What did ancient people dream about?">
          <span class="card-tag">History</span>
          <span class="card-text">What did ancient people dream about?</span>
        </button>
        <button class="card" data-q="Can you learn a language while you sleep?">
          <span class="card-tag">Mind</span>
          <span class="card-text">Can you learn a language while you sleep?</span>
        </button>
      </div>
    </section>

    <section class="response glass" id="response" hidden aria-live="polite">
      <p class="response-label">You asked</p>
      <p class="response-q" id="responseQ"></p>
      <p class="response-status" id="responseStatus">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="response-note">Let's pull that thread together…</span>
      </p>
      <button type="button" class="response-reset" id="responseReset">Ask something else</button>
    </section>
  </main>

  <footer class="footer">
    <span>© 2026 Qriously</span>
    <span class="footer-dot" aria-hidden="true">·</span>
    <span>Stay curious.</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
