<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Qriously — What made you Qrious today?</title>
  <meta name="description" content="Ask anything. Qriously turns your curiosity into understanding." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hud">
    <a class="brand" href="../index.html" aria-label="Qriously home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-3.5-3.5" />
        </svg>
      </span>
      <span class="brand-name">Qriously</span>
    </a>
    <div class="hud-stats">
      <span class="lvl">Scholar <b id="lvlNum">1</b></span>
      <div class="xp" role="progressbar" aria-label="Curiosity experience" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="xpBar">
        <span class="xp-fill" id="xpFill"></span>
        <span class="xp-text" id="xpText">0 / 100 XP</span>
      </div>
    </div>
    <nav class="topnav">
      <a class="navbtn" href="#">Sign in</a>
    </nav>
  </header>

  <main class="stage">
    <p class="eyebrow">✦ Quest Board ✦</p>

    <h1 class="hero">
      What made you
      <span class="spark">Qrious</span>
      today?
    </h1>
    <p class="sub">Every question is a quest. Accept one and begin.</p>

    <form class="ask" id="askForm" autocomplete="off">
      <span class="ask-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
          <path d="M12 17h.01" />
        </svg>
      </span>
      <input
        id="askInput"
        name="question"
        type="text"
        placeholder="Speak your question, adventurer…"
        aria-label="What made you Qrious today?"
      />
      <button type="submit" class="ask-btn">
        <span>Accept</span>
      </button>
    </form>

    <p class="hint">Press <kbd>Enter</kbd> · Reward: <b>+25 XP</b></p>

    <section class="samples" id="samples" aria-label="Sample quests">
      <p class="samples-label">Available quests</p>
      <div class="cards">
        <button class="card" data-q="Why is the sky blue?">
          <span class="card-tag">Physics</span>
          <span class="card-text">Why is the sky blue?</span>
          <span class="card-reward">+25 XP</span>
        </button>
        <button class="card" data-q="How do black holes bend time?">
          <span class="card-tag">Space</span>
          <span class="card-text">How do black holes bend time?</span>
          <span class="card-reward">+25 XP</span>
        </button>
        <button class="card" data-q="What did ancient people dream about?">
          <span class="card-tag">History</span>
          <span class="card-text">What did ancient people dream about?</span>
          <span class="card-reward">+25 XP</span>
        </button>
        <button class="card" data-q="Can you learn a language while you sleep?">
          <span class="card-tag">Mind</span>
          <span class="card-text">Can you learn a language while you sleep?</span>
          <span class="card-reward">+25 XP</span>
        </button>
      </div>
    </section>

    <section class="response" id="response" hidden aria-live="polite">
      <p class="response-label">Quest Accepted</p>
      <p class="response-q" id="responseQ"></p>
      <p class="response-status" id="responseStatus">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="response-note">Consulting the archives…</span>
      </p>
      <button type="button" class="response-reset" id="responseReset">New quest</button>
    </section>
  </main>

  <div class="sparkles" id="sparkles" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="toast-icon">✦</span>
    <span id="toastText">+25 XP · Quest accepted</span>
  </div>

  <footer class="footer">
    <span>© 2026 Qriously</span>
    <span class="footer-dot">✦</span>
    <span>Stay curious, adventurer.</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
